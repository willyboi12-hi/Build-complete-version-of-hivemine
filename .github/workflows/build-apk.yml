name: HiveMine Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find HiveMine ZIP
        shell: bash
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print \
            -quit)

          if [ -z "$ZIP" ]; then
            echo "::error::No HiveMine ZIP found in repository root."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract HiveMine project
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/hivemine-project"
          mkdir -p "$GITHUB_WORKSPACE/hivemine-project"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/hivemine-project"

          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/hivemine-project" \
            -maxdepth 4 \
            -type f | sort | head -200

      - name: Locate Gradle wrapper
        shell: bash
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE/hivemine-project" \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-35|build-tools;35.0.0" || true

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Show Gradle version
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build HiveMine debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload HiveMine APK
        uses: actions/upload-artifact@v4
        with:
          name: HiveMine-Mobile-V1.0-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
