name: HiveMine Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          pwd
          ls -la
          test -f gradlew || {
            echo "::error::gradlew is missing from the repository root."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build HiveMine APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload HiveMine APK
        uses: actions/upload-artifact@v4
        with:
          name: HiveMine-Mobile-V1.0-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
