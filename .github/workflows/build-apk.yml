name: HiveMine Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        shell: bash
        run: |
          echo "Current directory:"
          pwd
          echo
          echo "Repository contents:"
          ls -la
          echo
          echo "Gradle files:"
          find . -maxdepth 4 -type f \( \
            -name "gradlew" -o \
            -name "gradle-wrapper.properties" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Gradle wrapper
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found."
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          "$GITHUB_WORKSPACE/$GRADLEW" :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          echo "APK files found:"
          find . -type f -path "*/build/outputs/apk/debug/*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiveMine-Mobile-V1.0-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
